name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Testar leitura de respostas de Google Forms
        run: node --test tests/forms-response-parser.test.mjs

      - name: Testar regras comerciais e geração de PDF
        run: npm run test:crm

      - name: Build
        run: npm run build
